<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Copy AI ID</title>
    <script type="module" crossorigin src="/assets/index.html-B1fg6IAZ.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/notebook-notice-CNkUUrL6.js">
    <link rel="stylesheet" crossorigin href="/assets/index-CmELeRNH.css">
  </head>
  <body class="popup" data-ai-id="popup-page">
    <main class="popup__card" data-ai-id="popup-card" data-enabled="false" data-state="off">
      <section class="popup__shortcuts" data-ai-id="popup-shortcuts-section">
        <div class="popup__shortcut-list" data-ai-id="popup-shortcut-hint">
          <span><strong>Shift + Z + Space</strong>: ON/OFF</span>
          <span><strong>Space</strong>: Note</span>
          <span><strong>Shift + Enter</strong>: Copy</span>
          <span><strong>Arrows</strong>: DOM traversal</span>
          <a
            class="popup__guide-link"
            data-ai-id="popup-data-ai-id-github-link"
            href="https://github.com/airman5573/copy-ai-id/blob/main/docs/add-data-ai-id.md"
            target="_blank"
            rel="noreferrer"
          >
            Detailed manual
          </a>
        </div>
      </section>

      <section class="popup__notice" data-ai-id="popup-notice-section">
        <button
          class="popup__notice-button"
          type="button"
          data-ai-id="popup-notice-button"
          aria-haspopup="dialog"
          aria-expanded="false"
        >
          Copy notice
        </button>
      </section>
      <div
        class="popup__notice-dialog-backdrop"
        data-ai-id="popup-notice-dialog-backdrop"
        hidden
      >
        <section
          class="popup__notice-dialog"
          data-ai-id="popup-notice-dialog"
          role="dialog"
          aria-labelledby="popup-notice-dialog-title"
        >
          <div class="popup__notice-dialog-header">
            <h2 id="popup-notice-dialog-title" data-ai-id="popup-notice-dialog-title">
              Copy notice
            </h2>
            <p data-ai-id="popup-notice-dialog-description">
              Shown under Rules only when the copied note includes at least one data-ai-id target.
            </p>
          </div>
          <textarea
            class="popup__notice-textarea"
            data-ai-id="popup-notice-textarea"
            spellcheck="false"
          ></textarea>
          <div class="popup__notice-dialog-actions">
            <button
              class="popup__notice-dialog-button"
              type="button"
              data-ai-id="popup-notice-cancel-button"
            >
              Cancel
            </button>
            <button
              class="popup__notice-dialog-button popup__notice-dialog-button--primary"
              type="button"
              data-ai-id="popup-notice-save-button"
            >
              Save
            </button>
          </div>
        </section>
      </div>

      <button
        class="popup__toggle"
        type="button"
        data-ai-id="popup-toggle-button"
        aria-pressed="false"
      >
        Turn ON
      </button>

      <p class="popup__warning" role="alert" data-ai-id="popup-file-access-hint" hidden>
        <strong>file://</strong> needs <strong>Allow access to file URLs</strong>.
      </p>

    </main>

  </body>
</html>
